name: wynford_weather_alerts
description: Wynford Weather Alerts - iOS focused app for creating and receiving weather warnings.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  shared_preferences: ^2.0.15
  flutter_local_notifications: ^17.2.1   # ✅ upgraded to latest stable
  uuid: ^3.0.7
  intl: ^0.19.0                          # ✅ added for DateFormat

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  # Keep app icon/defaults configured in Xcode for iOS
  # No platform-specific package setup beyond Info.plist permission request for notifications
