workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "wynford.weather.mission"   # your bundle ID
        APP_NAME: "Wynford Weather Alerts"     # your app name
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Build iOS unsigned (Simulator)
        script: |
          flutter build ios --release --no-codesign --simulator
    artifacts:
      - build/ios/iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - your@email.com   # change this
        on_success: always
        on_failure: always
