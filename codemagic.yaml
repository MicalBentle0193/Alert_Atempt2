workflows:
  ios-release-ipa:
    name: iOS Release IPA Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "wynford.weather.mission"
        APP_NAME: "Wynford Weather Alerts"
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Build signed IPA for App Store/TestFlight
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - wynford0193@gmail.com   # Optional: replace with your email to get the IPA
