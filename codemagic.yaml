workflows:
  build-all:
    name: Build iOS & Android
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      android:
        build_tools: "33.0.2"
        ndk: "27.0.12077973"
      vars:
        APP_ID: "com.wynford.weather.mission"
        BUNDLE_ID: "wynford.weather.mission"
        APP_NAME: "Wynford Weather Alerts"
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Build Android APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/*.ipa
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your@email.com
