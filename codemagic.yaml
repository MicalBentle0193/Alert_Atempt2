workflows:
  ios-signed-workflow:
    name: iOS Signed IPA Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "wynford.weather.mission"
        APP_NAME: "Wynford Weather Alerts"
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build signed iOS IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com  # <- replace with your email
