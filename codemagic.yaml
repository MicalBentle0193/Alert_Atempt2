workflows:
  android-unsigned:
    name: Android Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        BUNDLE_ID: "wynford.weather.mission"   # <- change if needed
        APP_NAME: "Wynford Weather Alerts"     # <- change if needed
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build Android unsigned APK
        script: |
          flutter build apk --release --no-shrink --no-sign
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your@email.com   # <- change this
